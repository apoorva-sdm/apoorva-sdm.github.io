<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<script>
// start loading every face the page uses straight away, and let the page wait for exactly these before measuring anything
window.FONTS = document.fonts ? Promise.all(['300 16px Satoshi', '400 16px Satoshi', 'italic 400 16px Satoshi', '500 16px Satoshi', '700 16px Satoshi',
  '400 16px "Bricolage Grotesque"', '500 16px "Bricolage Grotesque"'].map(f => document.fonts.load(f).catch(() => {}))).then(() => document.fonts.ready) : Promise.resolve();
</script>
<title>Playground preview</title>
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>

  /* two themes: dark (the Figma design) and light. Everything colour-related reads these. */
  :root { --bg: #010707; --bgrgb: 1,7,7; --ink: #f2f2f2; --ink2: #fff; --hook: #e4e4e4; --blue: #729FC3;
          --hi: 255,255,255; --hiA: 1; --shA: 1; --logoF: contrast(1); --sel: #d5d5d5; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f4f6f6; --bgrgb: 244,246,246; --ink: #010707; --ink2: #0d1515; --hook: #010707; --blue: #4f7fa8;
          --hi: 1,7,7; --hiA: .38; --shA: .28; --logoF: invert(1) hue-rotate(180deg); --sel: #2a3232; color-scheme: light; }
  /* smooth switch between themes */
  @view-transition { navigation: auto; }
  .nav { view-transition-name: site-nav; } .logo { view-transition-name: site-logo; } .themeBtn { view-transition-name: site-theme; }
  ::view-transition-group(site-nav), ::view-transition-group(site-logo), ::view-transition-group(site-theme) { animation: none; }
  ::view-transition-old(site-nav), ::view-transition-old(site-logo), ::view-transition-old(site-theme) { display: none; }
  ::view-transition-new(site-nav), ::view-transition-new(site-logo), ::view-transition-new(site-theme) { animation: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .7s; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  * { box-sizing: border-box; font-synthesis: none; }
  html, body { margin: 0; background: var(--bg); overflow-x: hidden; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  /* 1440 × 2000 Figma frame "Home 1", scaled to the window width for previewing */
  .stage { width: 1440px; height: 5022px; position: relative; overflow: hidden; background: var(--bg); transform-origin: top left; }
  .abs { position: absolute !important; }

  /* nav */
  .logo { left: 120px; top: 32px; width: 48px; height: 48px; border-radius: 40px; }
  .logo img { filter: var(--logoF); position: absolute; left: 6.84px; top: 14.76px; width: 34.32px; height: 18.48px; display: block; }
  .nav { left: 841px; top: 32px; display: flex; gap: 20px; align-items: center; }
  .nav a { font-family: 'Satoshi', sans-serif; font-weight: 400; font-size: 14px; line-height: 19px; letter-spacing: 0.28px;
           color: var(--ink); padding: 14px 20px; border-radius: 50px; text-decoration: none; white-space: nowrap;
           display: flex; align-items: center; gap: 10px; transition: background .25s; }
  .nav a.glass:hover { background: linear-gradient(135deg, rgba(var(--hi), calc(0.12 * var(--hiA))), rgba(var(--hi), calc(0.17 * var(--hiA)))); }
  /* "Get In Touch": blue #729FC3 at 40% under the glass */
  /* the page you're on: brighter glass (22% instead of 10%) */
  .nav a.glass.current { background: rgba(var(--hi), calc(0.22 * var(--hiA))); }
  :root[data-theme="light"] .nav a.glass.current { background: rgba(1,7,7,0.09); }
  .nav a.cta { font-weight: 500; background: rgba(114,159,195,0.4); }
  :root[data-theme="light"] .nav a.cta { background: rgba(79,127,168,0.4); }
  .nav a.cta:hover { background: rgba(114,159,195,0.52); }
  .nav a.cta svg { width: 16px; height: 16px; display: block; }

  .themeBtn { left: 774px; top: 32px; width: 47px; height: 47px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
  .themeBtn svg { width: 18px; height: 18px; grid-area: 1 / 1; transition: opacity .5s ease, transform .6s cubic-bezier(.3,.7,.2,1); }
  .themeBtn .moon { opacity: 0; transform: rotate(-70deg) scale(.6); }
  :root[data-theme="light"] .themeBtn .sun { opacity: 0; transform: rotate(70deg) scale(.6); }
  :root[data-theme="light"] .themeBtn .moon { opacity: 1; transform: none; }
  .themeBtn:hover { background: linear-gradient(135deg, rgba(var(--hi), calc(0.12 * var(--hiA))), rgba(var(--hi), calc(0.17 * var(--hiA)))); }
  /* Figma "Glass": frosted blur behind, faint fill, thin bright rim (top-left / bottom-right glints), faint inner glow */
  .glass { position: relative; isolation: isolate;
    background: linear-gradient(135deg, rgba(var(--hi), calc(0.085 * var(--hiA))) 0%, rgba(var(--hi), calc(0.10 * var(--hiA))) 55%, rgba(var(--hi), calc(0.13 * var(--hiA))) 100%);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: conic-gradient(from 0deg,
      rgba(var(--hi), calc(.37 * var(--hiA))) 0deg, rgba(var(--hi), calc(.37 * var(--hiA))) calc(var(--c,72deg) + 0.5deg),
      rgba(var(--hi), calc(.03 * var(--hiA))) calc(var(--c,72deg) + 6deg), rgba(var(--hi), calc(.03 * var(--hiA))) calc(var(--c,72deg) + 11deg),
      rgba(var(--hi), calc(.28 * var(--hiA))) 90deg, rgba(var(--hi), calc(.30 * var(--hiA))) calc(180deg - var(--c,72deg) - 12deg),
      rgba(var(--hi), calc(.50 * var(--hiA))) calc(180deg - var(--c,72deg) - 7deg), rgba(var(--hi), calc(.50 * var(--hiA))) calc(180deg - var(--c,72deg) - 2deg),
      rgba(var(--hi), calc(.25 * var(--hiA))) calc(180deg - var(--c,72deg) + 3deg), rgba(var(--hi), calc(.25 * var(--hiA))) calc(180deg + var(--c,72deg) - 3deg),
      rgba(var(--hi), calc(.03 * var(--hiA))) calc(180deg + var(--c,72deg) + 5deg), rgba(var(--hi), calc(.03 * var(--hiA))) calc(180deg + var(--c,72deg) + 11deg),
      rgba(var(--hi), calc(.42 * var(--hiA))) 270deg,
      rgba(var(--hi), calc(.75 * var(--hiA))) calc(360deg - var(--c,72deg) - 10deg), rgba(var(--hi), calc(.75 * var(--hiA))) calc(360deg - var(--c,72deg) - 5deg),
      rgba(var(--hi), calc(.37 * var(--hiA))) calc(360deg - var(--c,72deg) - 0.5deg), rgba(var(--hi), calc(.37 * var(--hiA))) 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .glass::after { content: ""; position: absolute; inset: 1px; border-radius: inherit; pointer-events: none;
    box-shadow: inset -1px -1.5px 2px rgba(var(--hi), calc(0.07 * var(--hiA))); }

  :root[data-theme="light"] .glass { background: rgba(1,7,7,0.04); }
  :root[data-theme="light"] .glass::before { opacity: .25; }
  /* Stand-in until the Playground page is built: your Figma frame "Home 4" (327:3939) as a picture, under the real nav */
  .shot { left: 0; top: 0; width: 1440px; height: 2461px; display: block; }
  .navCover { left: 0; top: 0; width: 1440px; height: 112px; background: var(--bg); }
</style></head>
<body>
<div id="shell"><div class="stage" id="stage" style="height:2461px">
<script>(() => { const s = innerWidth / 1440, st = document.getElementById('stage'); st.style.transform = `scale(${s})`; document.getElementById('shell').style.height = 2461 * s + 'px'; })();</script>
  <img class="shot abs" src="playground-figma.png" alt="Playground page design (preview image)">
  <div class="navCover abs"></div>
  <button class="themeBtn glass abs" id="themeBtn" style="--c:0.00deg" type="button" aria-label="Switch to light theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z"/></svg>
  </button>
  <a class="logo abs" id="logo" href="home.html"><img src="logo-t@4x.png" alt="Logo — back to home"></a>
  <nav class="nav abs" id="nav">
    <a style="--c:33.41deg" href="home.html" class="glass">Home</a><a style="--c:34.25deg" href="about.html" class="glass">About</a><a style="--c:54.13deg" href="playground.html" class="glass current" aria-current="page">Playground</a>
    <a style="--c:65.47deg" href="#" class="glass cta">Get In Touch
      <svg viewBox="0 0 16 16"><path d="M0 8C0 10.1217 0.842855 12.1566 2.34315 13.6569C3.84344 15.1571 5.87827 16 8 16C10.1217 16 12.1566 15.1571 13.6569 13.6569C15.1571 12.1566 16 10.1217 16 8C16 5.87827 15.1571 3.84344 13.6569 2.34315C12.1566 0.842855 10.1217 0 8 0C5.87827 0 3.84344 0.842855 2.34315 2.34315C0.842855 3.84344 0 5.87827 0 8ZM5.904 10.803C5.85788 10.8508 5.8027 10.8888 5.7417 10.9151C5.6807 10.9413 5.61509 10.955 5.5487 10.9556C5.48231 10.9562 5.41647 10.9436 5.35502 10.9184C5.29357 10.8933 5.23775 10.8561 5.1908 10.8092C5.14386 10.7623 5.10673 10.7064 5.08159 10.645C5.05645 10.5835 5.0438 10.5177 5.04437 10.4513C5.04495 10.3849 5.05874 10.3193 5.08495 10.2583C5.11115 10.1973 5.14924 10.1421 5.197 10.096L9.293 6H6.525C6.39239 6 6.26521 5.94732 6.17145 5.85355C6.07768 5.75979 6.025 5.63261 6.025 5.5C6.025 5.36739 6.07768 5.24021 6.17145 5.14645C6.26521 5.05268 6.39239 5 6.525 5H10.5C10.6326 5 10.7598 5.05268 10.8536 5.14645C10.9473 5.24021 11 5.36739 11 5.5V9.475C11 9.60761 10.9473 9.73479 10.8536 9.82855C10.7598 9.92232 10.6326 9.975 10.5 9.975C10.3674 9.975 10.2402 9.92232 10.1464 9.82855C10.0527 9.73479 10 9.60761 10 9.475V6.707L5.904 10.803Z" fill="currentColor"/></svg>
    </a>
  </nav>
</div></div>
<script>
const stage = document.getElementById('stage'), shell = document.getElementById('shell');
function fit() { const s = innerWidth / 1440; stage.style.transform = `scale(${s})`; shell.style.height = 2461 * s + 'px'; }
fit(); addEventListener('resize', fit);
document.querySelectorAll('.glass').forEach(el => { if (el.style.getPropertyValue('--c')) return; const w = el.offsetWidth, h = el.offsetHeight;
  el.style.setProperty('--c', (Math.atan2(w / 2 - h / 2, h / 2) * 180 / Math.PI).toFixed(2) + 'deg'); });
const themeBtn = document.getElementById('themeBtn');
const cur = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
const label = () => themeBtn.setAttribute('aria-label', cur() === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
label();
themeBtn.addEventListener('click', () => { const next = cur() === 'light' ? 'dark' : 'light';
  const apply = () => { document.documentElement.dataset.theme = next; label(); };
  try { localStorage.setItem('theme', next); } catch (e) {}
  document.startViewTransition ? document.startViewTransition(apply) : apply(); });
</script>
</body></html>

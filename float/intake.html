<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOAT intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* FLOAT brand styling. Raleway; sky #95BCE3 and peach #F5AF92.
   Brand colours are surfaces only: white text on them fails contrast, so text on them is ink. */
:root {
  color-scheme: light;
  --sky: #95BCE3;
  --peach: #F5AF92;
  --sky-soft: #E7F0FA;
  --peach-soft: #FDEDE5;
  --sky-deep: #3F6E9E;
  --peach-deep: #A8502C;
  --ink: #283353;
  --muted: #5A6480;
  --line: rgba(40, 51, 83, .14);
  --sheet: rgba(255, 255, 255, .84);
  --sheet-edge: rgba(255, 255, 255, .9);
  --field: #ffffff;
  --btn-bg: #95BCE3;
  --btn-ink: #283353;
  --sel-bg: #283353;
  --sel-ink: #ffffff;
  --shadow: 0 24px 60px -30px rgba(40, 51, 83, .45);
  --page-bg: linear-gradient(180deg, #95BCE3 0%, #F5AF92 100%);
  --on-bg: #283353;
  --on-bg-muted: #4A5472;
  --on-bg-line: rgba(40, 51, 83, .35);
  --glass: linear-gradient(145deg, rgba(255, 255, 255, .46), rgba(255, 255, 255, .2));
  --glass-edge: rgba(255, 255, 255, .55);
  --glass-shine: inset 0 1px 0 rgba(255, 255, 255, .75), inset 0 -1px 0 rgba(255, 255, 255, .15);
  --glass-field: rgba(255, 255, 255, .42);
  --glass-field-edge: rgba(255, 255, 255, .7);
  --glass-field-hover: rgba(255, 255, 255, .62);
  --grain-opacity: .08;
  --font: "Raleway", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sky-soft: #26314F; --peach-soft: #3A2E3A; --sky-deep: #95BCE3; --peach-deep: #F5AF92;
    --ink: #EDF1F8; --muted: #AAB3C8; --line: rgba(237, 241, 248, .14);
    --sheet: rgba(31, 39, 66, .86); --sheet-edge: rgba(149, 188, 227, .16); --field: #252E4C;
    --btn-bg: #95BCE3; --btn-ink: #1F2742; --sel-bg: #EDF1F8; --sel-ink: #1F2742;
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .7);
    --grain-opacity: .08; --glass: linear-gradient(145deg, rgba(40, 51, 83, .62), rgba(31, 39, 66, .38)); --glass-edge: rgba(237, 241, 248, .18); --glass-shine: inset 0 1px 0 rgba(237, 241, 248, .16), inset 0 -1px 0 rgba(0, 0, 0, .2); --glass-field: rgba(31, 39, 66, .45); --glass-field-edge: rgba(237, 241, 248, .16); --glass-field-hover: rgba(31, 39, 66, .65);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sky-soft: #26314F; --peach-soft: #3A2E3A; --sky-deep: #95BCE3; --peach-deep: #F5AF92;
  --ink: #EDF1F8; --muted: #AAB3C8; --line: rgba(237, 241, 248, .14);
  --sheet: rgba(31, 39, 66, .86); --sheet-edge: rgba(149, 188, 227, .16); --field: #252E4C;
  --btn-bg: #95BCE3; --btn-ink: #1F2742; --sel-bg: #EDF1F8; --sel-ink: #1F2742;
  --shadow: 0 24px 60px -30px rgba(0, 0, 0, .7);
  --grain-opacity: .08; --glass: linear-gradient(145deg, rgba(40, 51, 83, .62), rgba(31, 39, 66, .38)); --glass-edge: rgba(237, 241, 248, .18); --glass-shine: inset 0 1px 0 rgba(237, 241, 248, .16), inset 0 -1px 0 rgba(0, 0, 0, .2); --glass-field: rgba(31, 39, 66, .45); --glass-field-edge: rgba(237, 241, 248, .16); --glass-field-hover: rgba(31, 39, 66, .65);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; min-height: 100%; background: #F5AF92 var(--page-bg) no-repeat fixed; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background: #F5AF92 var(--page-bg) no-repeat fixed;
  font: 500 1rem/1.6 var(--font); font-variant-numeric: lining-nums tabular-nums;
  overflow-x: hidden; position: relative;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.2 0 0 0 0 0.33 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.bar, main { position: relative; z-index: 2; }

/* Floating lights */
.orbs { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.orb {
  position: absolute; left: var(--x); top: var(--y);
  width: calc(var(--s) * 2.2); height: calc(var(--s) * 2.2);
  margin: calc(var(--s) * -1.1) 0 0 calc(var(--s) * -1.1); border-radius: 50%;
  background: radial-gradient(circle closest-side,
    #FFFFF6 0%, #FFFFF2 34%, rgba(255, 252, 240, .9) 40%,
    rgba(255, 246, 236, .45) 50%, rgba(255, 242, 234, .18) 68%, rgba(255, 240, 232, 0) 100%);
  opacity: var(--o, .95);
  animation: orb-bob var(--d) ease-in-out var(--delay) infinite alternate;
  will-change: transform;
}
@keyframes orb-bob {
  from { transform: translate3d(0, calc(var(--a) * -1.2), 0); }
  to { transform: translate3d(0, calc(var(--a) * 1.2), 0); }
}
@media (max-width: 30rem) { .orb:nth-child(n + 11) { display: none; } }

/* Header */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 72rem; margin: 0 auto; padding: 1rem 1.25rem; }
.brand { color: var(--ink); text-decoration: none; display: inline-flex; align-items: baseline; gap: .5rem; }
.wordmark { font-weight: 800; font-size: 1.35rem; letter-spacing: .04em; }
.brand-sub { font-weight: 500; font-size: .9rem; color: var(--muted); }
.bar nav { display: flex; gap: .25rem; padding: .25rem; border-radius: 999px; background: var(--sheet); border: 1px solid var(--sheet-edge); }
.brand, .bar nav a { white-space: nowrap; }
.bar nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: .92rem; padding: .4rem .85rem; border-radius: 999px; }
.bar nav a[aria-current="page"] { color: var(--sel-ink); background: var(--sel-bg); }

/* Page */
main { max-width: 38rem; margin: 0 auto; padding: clamp(.75rem, 5vh, 3.5rem) 1.25rem 4rem; }
main.wide { max-width: 72rem; }

h1 { font-size: clamp(1.55rem, 1.2rem + 1.4vw, 2.1rem); line-height: 1.2; letter-spacing: -.01em; margin: 0 0 .8rem; font-weight: 700; }
h1:focus { outline: none; }
h2 { font-size: 1.08rem; line-height: 1.3; margin: 2rem 0 .5rem; font-weight: 700; }
h3 { font-size: .92rem; margin: 0 0 .35rem; color: var(--muted); font-weight: 700; }
p { margin: 0 0 1rem; }
.lead { font-size: 1.12rem; line-height: 1.55; }
.muted, .hint { color: var(--muted); }
.hint { font-size: .9rem; margin: .1rem 0 0; }
.error { color: var(--peach-deep); font-weight: 600; font-size: .92rem; margin: .4rem 0 0; }
.flag { color: var(--peach-deep); font-weight: 600; font-size: .92rem; }
a { color: var(--sky-deep); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 3px; }

/* The sheet: every participant screen sits on one */
.screen {
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 28px;
  padding: clamp(1.4rem, 1rem + 2vw, 2.4rem);
  box-shadow: var(--glass-shine), 0 30px 60px -34px rgba(40, 51, 83, .45);
  -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
}

.hint-row { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; }
.hint-row p { margin: 0; }

/* Buttons */
.btn {
  font: inherit; font-weight: 700; min-height: 46px; padding: .6rem 1.35rem; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
}
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(.94); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 34px; padding: .25rem .85rem; font-size: .85rem; }
.btn.danger { border-color: var(--peach-deep); color: var(--peach-deep); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn[hidden] { display: none; }
.nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: center; margin-top: 1.75rem; }
.nav.end { justify-content: flex-end; }
.nav-group { display: flex; gap: .5rem; flex-wrap: wrap; }

/* Progress */
.progress { display: grid; gap: .45rem; margin-bottom: 1.4rem; color: var(--muted); font-size: .88rem; font-weight: 600; }
.progress .bar { display: block; max-width: none; margin: 0; height: 6px; padding: 0; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sky), var(--peach)); }

/* Fields and options */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.legend { font-weight: 700; margin-bottom: .25rem; }
.field { display: grid; gap: .3rem; margin: 0 0 1.75rem; }
.field label { font-weight: 700; }
.field input { font: inherit; padding: .7rem .9rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); color: var(--ink); }
.options { display: grid; gap: .55rem; margin-top: .75rem; }
.option {
  display: flex; gap: .8rem; align-items: flex-start; padding: .85rem 1rem; border: 1.5px solid var(--line);
  border-radius: 16px; background: var(--field); cursor: pointer; line-height: 1.45;
}
.option input { flex: none; width: 1.15rem; height: 1.15rem; margin: .15rem 0 0; accent-color: var(--sky-deep); }
.option:hover { border-color: var(--sel-bg); }
.option.is-checked { border-color: var(--sel-bg); background: var(--sel-bg); color: var(--sel-ink); }
.option.is-checked input { accent-color: var(--sel-ink); }

/* Order of need */
.order { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .55rem; }
.order-item {
  position: relative; width: 100%; min-height: 52px; display: flex; gap: .85rem; align-items: center; text-align: left;
  font: inherit; color: var(--ink); padding: .75rem 1rem; border: 1.5px solid var(--line); border-radius: 16px; background: var(--field); cursor: pointer;
}
.order-item .pos { flex: none; width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-weight: 800; }
.order-item[aria-pressed="true"] { border-color: var(--peach); background: var(--peach-soft); }
.order-item[aria-pressed="true"] .pos { border: 0; background: var(--peach); color: #283353; }

/* Result */
.result h1 { font-size: clamp(1.8rem, 1.3rem + 2.2vw, 2.6rem); }
.backup { margin-top: 2rem; padding: 1.1rem 1.2rem .3rem; border-radius: 18px; background: var(--sky-soft); }
.backup h2 { margin-top: 0; }
.save-status { margin-top: 1.5rem; font-size: .92rem; color: var(--muted); }
.save-status p { margin-bottom: .5rem; }
.matching { text-align: center; padding-block: 3rem; }
.intro h1 { font-size: clamp(1.8rem, 1.3rem + 2.2vw, 2.5rem); }

/* Board */
.board > h1, .board > p, .board > .sync { position: relative; }
.controls {
  display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: end; margin: 1rem 0; padding: 1rem 1.2rem;
  background: var(--sheet); border: 1px solid var(--sheet-edge); border-radius: 20px; box-shadow: var(--shadow);
}
.controls label { display: grid; gap: .3rem; font-size: .9rem; font-weight: 600; color: var(--muted); }
.controls input[type="number"] { width: 5.5rem; font: inherit; padding: .45rem .6rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); }
.controls .check { display: flex; gap: .5rem; align-items: center; color: var(--ink); min-height: 44px; }
.controls .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--sky-deep); }
.rules { margin: 0 0 1.5rem; padding: .8rem 1.2rem; background: var(--sheet); border-radius: 16px; border: 1px solid var(--sheet-edge); }
.rules summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.rules ol { margin: .6rem 0 .3rem; padding-left: 1.3rem; color: var(--muted); }
.rules li { margin-bottom: .35rem; }
.summary { font-weight: 700; font-size: 1.05rem; }
.sync { margin: .25rem 0 1rem; }
.sync .nav-group { margin-top: .25rem; }

.cohorts { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
.cohort { padding: 1.1rem 1.2rem; background: var(--sheet); border: 1px solid var(--sheet-edge); border-radius: 22px; box-shadow: var(--shadow); }

.cohort.idle { background: transparent; border: 1.5px dashed var(--line); box-shadow: none; }
.cohort header { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.cohort h2 { margin: 0; font-size: 1.15rem; }
.cohort .asks { color: var(--muted); font-size: .9rem; margin: .15rem 0 .6rem; }
.cohort .count { font-size: .92rem; margin-bottom: .6rem; }
.state { font-size: .82rem; font-weight: 700; padding: .05rem .6rem; border-radius: 999px; }
.cohort.runs .state { background: var(--sel-bg); color: var(--sel-ink); }
.cohort.idle .state { color: var(--muted); }
.group { margin-top: .8rem; }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.people li { font-size: .92rem; line-height: 1.7; }
.people .name { margin-right: .35rem; }
.people .tag { display: inline-block; margin: 0 .25rem .15rem 0; line-height: 1.45; vertical-align: middle; }
.name { font-weight: 700; }
.tag { font-size: .74rem; font-weight: 600; padding: .05rem .5rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; }
.tag.backup { border-color: var(--sel-bg); background: var(--sel-bg); color: var(--sel-ink); }
.tag.close { border-color: var(--peach); background: var(--peach-soft); color: var(--peach-deep); }
.held { margin-top: 1.5rem; padding: 1rem 1.2rem; border: 1.5px dashed var(--peach); border-radius: 20px; background: var(--peach-soft); }
.held h2 { margin-top: 0; }
.table-title { margin-top: 2.5rem; }
.table-wrap { position: relative; overflow-x: auto; background: var(--sheet); border: 1px solid var(--sheet-edge); border-radius: 20px; box-shadow: var(--shadow); }
table { width: 100%; min-width: 48rem; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
thead th { color: var(--muted); font-weight: 700; }
tbody th { font-weight: 700; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
.num { color: var(--muted); }
.empty { padding: 2rem 1rem; text-align: center; border: 1.5px dashed var(--line); border-radius: 22px; background: var(--sheet); }
.empty h2 { margin-top: 0; }

.name-btn { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: .1rem 0; margin-right: .35rem; cursor: pointer; text-decoration: underline; text-decoration-color: var(--sel-bg); text-decoration-thickness: 2px; text-underline-offset: 4px; min-height: 32px; }
.name-btn:hover, .name-btn[aria-expanded="true"] { text-decoration-color: var(--peach); }
tr.is-open th, tr.is-open td { background: var(--sky-soft); border-bottom: 0; }
.detail-row td { padding: 0; background: var(--field); }
.detail { position: sticky; left: 0; width: min(68rem, calc(100vw - 4.5rem)); padding: 1.1rem 1.2rem 1.5rem; font-size: .95rem; }
.detail h3 { margin: 1.2rem 0 .4rem; color: var(--ink); font-size: .92rem; }
.detail h3:first-child { margin-top: 0; }
.detail h3 .muted { font-weight: 500; }
.detail-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); }
.small { font-size: .9rem; margin: .5rem 0 0; }
.order-summary { margin: 0; padding-left: 1.3rem; font-size: .9rem; }

.evidence { list-style: none; margin: .5rem 0 0; padding: 0; display: grid; gap: .35rem; }
.ev { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: .75rem; align-items: baseline; padding: .45rem .75rem; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; font-size: .9rem; }
.ev-q { color: var(--muted); font-size: .85rem; font-weight: 700; }
.ev-p { font-weight: 700; text-align: right; }
.ev-p b { color: var(--ink); }
.tally { display: grid; gap: .55rem; margin-top: .6rem; }
.t-row { display: grid; grid-template-columns: minmax(7.5rem, 11rem) 1fr 1.8rem 3.4rem; gap: .7rem; align-items: center; }
.t-name { font-weight: 700; line-height: 1.25; }
.t-name small { display: block; font-weight: 500; font-size: .78rem; color: var(--muted); }
.t-cells { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.t-cells i { height: .8rem; border-radius: 3px; background: var(--line); }
.t-cells i.on { background: var(--sel-bg); }
.t-row.is-primary .t-cells i.on { background: var(--peach); }
.t-num { text-align: right; font-weight: 800; }
.t-role { font-size: .8rem; font-weight: 700; color: var(--muted); }
.t-row.is-primary .t-role { color: var(--peach-deep); }
.verdict { margin-top: 1.1rem; padding: .9rem 1rem; background: var(--sheet); border-left: 4px solid var(--peach); border-radius: 0 12px 12px 0; }
.verdict p:last-child { margin-bottom: 0; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (max-width: 30rem) {
  main { padding: .5rem .75rem 3rem; }
  .bar { padding: .8rem .9rem; }
  .brand-sub { display: none; }
  .screen { border-radius: 22px; }
  .t-row { grid-template-columns: 1fr 1.8rem 3.2rem; }
  .t-row .t-cells { grid-column: 1 / -1; grid-row: 2; }
  .ev { grid-template-columns: 2.1rem 1fr; }
  .ev-p { grid-column: 2; text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .orb { animation: none; }
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .orb { --o: .55; } }
:root[data-theme="dark"] .orb { --o: .55; }

/* Glass controls inside the question frame */
.screen .option, .screen .order-item, .screen .field input {
  background: var(--glass-field); border-color: var(--glass-field-edge);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.screen .option:hover, .screen .order-item:hover { background: var(--glass-field-hover); border-color: var(--glass-field-edge); }
.screen .option.is-checked { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); }
.screen .order-item[aria-pressed="true"] { background: rgba(245, 175, 146, .55); border-color: rgba(255, 255, 255, .75); }
.screen .btn:not(.primary):not(.quiet) { background: var(--glass-field); border-color: var(--glass-field-edge); }
.screen .progress .bar { background: rgba(255, 255, 255, .45); }
.screen .backup { background: var(--glass-field); border: 1px solid var(--glass-field-edge); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .screen { background: rgba(255, 255, 255, .88); }
}

.legend + .small { margin: 0 0 .25rem; }

/* Text sitting directly on the sky uses the frame navy, in light and dark mode alike */
.bar .brand, .wordmark { color: var(--on-bg); }
.brand-sub { color: var(--on-bg-muted); }
.board > h1, .board > p { color: var(--on-bg); }
.board > p.muted, #board-status { color: var(--on-bg-muted); }
.sync > p, .sync .small { color: var(--on-bg-muted); }
.sync > p.flag { color: #7A3417; }
#board-results > .summary, #board-results > .table-title { color: var(--on-bg); }
#board-results > p.muted { color: var(--on-bg-muted); }
.cohort.idle { border-color: var(--on-bg-line); }
.cohort.idle, .cohort.idle h2, .cohort.idle .name-btn, .cohort.idle .count, .cohort.idle .people li { color: var(--on-bg); }
.cohort.idle .asks, .cohort.idle .state { color: var(--on-bg-muted); }
.cohort.idle .name-btn { text-decoration-color: var(--on-bg); }

</style>
</head>
<body>
<div class="orbs" aria-hidden="true">
  <span class="orb" style="--x:8%;--y:12%;--s:34px;--d:13.7s;--delay:-2.1s;--a:14px"></span>
  <span class="orb" style="--x:13.5%;--y:18%;--s:10px;--d:9.3s;--delay:-5.4s;--a:8px"></span>
  <span class="orb" style="--x:4.5%;--y:25%;--s:16px;--d:11.9s;--delay:-8.2s;--a:10px"></span>

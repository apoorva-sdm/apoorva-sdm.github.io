      rgba(var(--hi), calc(.03 * var(--hiA))) calc(180deg + var(--c,72deg) + 5deg), rgba(var(--hi), calc(.03 * var(--hiA))) calc(180deg + var(--c,72deg) + 11deg),

      rgba(var(--hi), calc(.75 * var(--hiA))) calc(360deg - var(--c,72deg) - 10deg), rgba(var(--hi), calc(.75 * var(--hiA))) calc(360deg - var(--c,72deg) - 5deg),

  /* carousel controls: round glass arrows either side, three dots underneath (the long one is the pair showing) */
  .arrow { top: 903px; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; color: var(--ink);

  /* knight "final 1" — your home-page knight at 0.48 × the size (110.3 × 165.44), same 0.52° tilt */

  .kWrap { left: 135px; top: 1648.01px; width: 134.16px; height: 199.73px; transform-origin: 66.70px 182.51px; will-change: transform; z-index: 2; }

  .rig { left: 0; top: 0; width: 232.93px; height: 346.76px; will-change: transform, opacity; opacity: 0; transform-origin: 50% 58%; }

  .exWhat li { position: relative; padding-left: 27px; }

  .exWhat li::before { content: "•"; position: absolute; left: 10px; }
  /* prev / next: the same blue glass pills as "Get In Touch" */
  .pager { left: 120px; top: 3226.71px; width: 1201px; display: flex; justify-content: space-between; }
  .pager a { height: 56.28px; padding: 14px 20px; border-radius: 50px; display: flex; align-items: center; text-decoration: none; color: var(--ink);
             font-family: 'Satoshi', sans-serif; font-weight: 400; font-size: 16px; line-height: 22px; letter-spacing: .32px; background: rgba(114,159,195,0.4); transition: background .3s ease; }
  .pager a b { font-weight: 500; }
  .pager a:hover { background: rgba(114,159,195,0.52); }
  .pager a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  :root[data-theme="light"] .pager a { background: rgba(79,127,168,0.4); }
  .pager svg { width: 28.28px; height: 20px; display: block; flex: none; overflow: visible; }   /* Figma: 28.28px between padding and text */
  /* footer (Figma "Frame 117") */
  .foot { left: 0; top: 3478.71px; width: 1440px; height: 266px; background: var(--foot); }
  .foot .reach { position: absolute; left: 0; width: 1440px; top: 109px; margin: 0; text-align: center; font-family: 'Satoshi', sans-serif; font-weight: 500;
                 font-size: 16px; line-height: 21.6px; letter-spacing: .32px; color: var(--footInk); }
  .foot .icons { position: absolute; left: 634.15px; top: 117px; width: 171.7px; height: 35.35px; display: block; }
  .foot .icons a { fill: var(--footIcon); transition: fill .25s ease; }
  .foot .icons a:hover { fill: #e4e4e4; }
  .foot .fine { position: absolute; left: 0; width: 1440px; top: 194px; margin: 0; display: flex; justify-content: center; align-items: center; gap: 8px;
                font-family: 'Satoshi', sans-serif; font-weight: 500; font-size: 14px; line-height: 19px; letter-spacing: .28px; color: var(--footFine); }
  .foot .fine svg { width: 16px; height: 16px; display: block; fill: var(--footFine); }
  /* footer (Figma "Frame 117", 3 Nov): "Up for a game of chess?" with a small glass knight turning round and round, leaning slightly back */
  .foot .chess { position: absolute; left: 534px; top: 53px; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 22px;
                 line-height: 30px; letter-spacing: .44px; color: #afafaf; white-space: nowrap; }
  .foot .kspin { position: absolute; left: 494px; top: 45px; width: 30px; height: 45px; overflow: hidden; }
  .foot .kspin img { position: absolute; left: 0; top: 0; width: 2160px; height: 45px; max-width: none; animation: kspin 3.5s steps(72) infinite; }
  @keyframes kspin { to { transform: translateX(-2160px); } }
  @media (prefers-reduced-motion: reduce) { .foot .kspin img { animation: none; } }

  /* gentle entrances */
  .pre { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .wave.waving img { animation: none; } }
  /* the theme switch is off (3 Nov): the site stays in the dark design */
  .themeBtn, .themeTip { display: none !important; }

I’m <b>Apoorva Bengaluru Sathyaprakash</b>. You might have already guessed where I’m from!

I studied as a <b>computer science engineer</b> at PES University, worked as a <b>consultant at Deloitte</b>, and now study <b>strategic design management</b> at the National Institute of Design. I work where <b>design, tech and business meet</b>: finding out why people behave the way they do, and turning that into products that work for them and for the business.

Outside work, I’m singing, dancing and reading.

If that sounds like someone you’d like on your team, let’s talk.</p>

    const onFrame = (now, meta) => { lastVF = performance.now(); show(meta.mediaTime); if (!video.ended && !fallen && !finished) video.requestVideoFrameCallback(onFrame); };
    const tick = () => { if (performance.now() - lastVF > 40) show(video.currentTime); if (!video.ended && !fallen && !finished) requestAnimationFrame(tick); };
    video.addEventListener('ended', () => { if (!fallen) { draw(); finish(); } }, { once: true });
    if (!gl) return fallback();
    video.currentTime = 0;
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onFrame);
    requestAnimationFrame(tick);
    const pr = video.play(); if (pr) pr.catch(fallback);
    setTimeout(() => { if (!started) fallback(); }, 1000);
  });
}

// ---- the knight's story in the triple diamond (positions are the centre of its base, in Figma coordinates; it never moves
// while the camera turns around it):
//   it twists and lands at your Figma spot → the camera rises to look straight down (head pointing towards Deliver)
//   → it walks the diamonds, standing in the middle of each half → after Deliver it hops out past the diamonds
//   → the camera comes back down to the side view. Iterate: the knight twists in again at the start, exactly as the
//   first time (the diamonds stay), and walks the next way round.
const HOME = { x: 201.70, y: 1830.52 };                    // base centre at your Figma knight
const EXIT = { x: 1245, y: 1830.52 };                      // just past the third diamond, level with the start
const CX = [419.33, 720.0, 1020.68], CY = 1796.97;
// each half has one square, in the corner nearest its name: lower in the left halves (Discover, Ideate, Test),
// upper in the right halves (Define, Develop, Deliver). The halves alternate, so every move is a clear knight's L:
// one step up or down, then two hops along. The knight sits with the same visible gap to the dashed centre line and to the
// diamond's slanted edge (that gap measured square-on to the edge, the way the eye reads it), using what you see from above:
// its outline reaches 37.2px behind the base centre and 40.7px in front (its head).
const HALF = { discover: [0, 'L'], define: [0, 'R'], ideate: [1, 'L'], develop: [1, 'R'], test: [2, 'L'], deliver: [2, 'R'] };
const HALFW = 152.74, LOWY = 36, HIGHY = -40, BACK = 37.2, FRONT = 40.7, R2 = Math.SQRT2;
// left half, lower row (head towards the dashed line): -(u + FRONT) = (u + HALFW - LOWY)/√2 - BACK
const uL = -(FRONT - BACK + (HALFW - LOWY) / R2) / (1 + 1 / R2);
// right half, upper row (back towards the dashed line): u - BACK = (HALFW + HIGHY - u)/√2 - BACK
const uR = ((HALFW + HIGHY) / R2) / (1 + 1 / R2);
const spot = name => { const [d, side] = HALF[name];
  return side === 'L' ? { x: CX[d] + uL, y: CY + LOWY } : { x: CX[d] + uR, y: CY + HIGHY }; };
// three ways through the diamonds. The phases always come in the same order; only the loops back differ,
// and the knight only ever steps forward to the very next phase (never Discover → Deliver in one go).
const STYLES = [
  ['discover', 'define', 'ideate', 'develop', 'test', 'develop', 'test', 'deliver'],               // builds, tests, builds again
  ['discover', 'define', 'discover', 'define', 'ideate', 'develop', 'test', 'deliver'],            // goes back to research once, then straight through
  ['discover', 'define', 'ideate', 'define', 'ideate', 'develop', 'test', 'deliver'],              // reframes the problem after the first ideas
];
let styleNow = 0, view = 'side';
// top view: being held shows only as a shadow sliding away; side view: it is lifted a little off the board. It never changes size.
function place(pt, lift = 0, hop = 0) {
  const h = clamp(lift * 0.6 + hop);
  const up = view === 'side' ? 9 * lift + 12 * hop : 0;
  kWrap.style.transform = `translate3d(${(pt.x - HOME.x).toFixed(2)}px, ${(pt.y - HOME.y - up).toFixed(2)}px, 0)`;
  kWrap.style.filter = view === 'top' && h > 0.01 ? `drop-shadow(${(2 + 7 * h).toFixed(1)}px ${(3 + 9 * h).toFixed(1)}px ${(3 + 7 * h).toFixed(1)}px rgba(0,0,0,${(0.55 - 0.2 * h).toFixed(2)}))` : '';
}
const phases = Object.fromEntries([...document.querySelectorAll('.phase')].map(p => [p.dataset.phase, p]));
function light(name) { Object.entries(phases).forEach(([k, el]) => el.classList.toggle('on', k === name)); }
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
// picked up, counted out in small hops through the given points, set down
async function hopThrough(pts, name) {
  light(null);
  const from = pts[0], to = pts[pts.length - 1];
  await tween(KT.pick, e => place(from, e), E.sine);
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k];
    await tween(KT.hop, (e, raw) => place(lerp(a, b, E.sine(raw)), 1, 4 * raw * (1 - raw)), t => t);
  }
  if (name) light(name);
  await tween(KT.set, e => place(to, 1 - e), E.sine);
}
// a knight's L: one step up or down, then two hops along. If the squares are (almost) level — only the very first move,
// from the start spot to Discover — it still makes the L: a step down, two hops along, and settles into its square.
function lMove(from, to) {
  if (Math.abs(to.y - from.y) > 20) { const turn = { x: from.x, y: to.y }; return [from, turn, lerp(turn, to, 0.5), to]; }
  const off = { x: from.x, y: from.y + 34 }; return [from, off, { x: (from.x + to.x) / 2, y: off.y }, to];
}
async function walk() {
  let here = HOME;
  const route = STYLES[styleNow];
  for (let i = 0; i < route.length; i++) {
    const to = spot(route[i]);
    await hopThrough(lMove(here, to), route[i]);
    here = to; await wait(KT.between);
  }
  return here;
}
// play one of the rendered clips on the knight's canvas
// always a real seek (even to where it already is): a clip loaded from memory may not have its picture decoded until asked
function seek(v, t) { return new Promise(r => { v.addEventListener('seeked', r, { once: true }); v.currentTime = t; setTimeout(r, 400); }); }
// onStart runs once, with the clip's first fresh frame on the canvas: after a replay, Safari can hand over the clip's last
// picture (the other camera angle) until it has really started again, so the canvas is only shown from that frame on
function play(v, onStart) { return new Promise(done => {
  let over = false, started = false;
  const start = () => { if (!started) { started = true; if (onStart) onStart(); } };
  const end = () => { if (over) return; over = true; clipPlayer.draw(v); start(); done(); };
  let lastVF = -1e9;   // as for the turn: a screen-refresh loop fills in if Safari stops sending frame calls
  const fresh = () => v.currentTime > 0.03;
  const onFrame = () => { lastVF = performance.now(); if (fresh()) { clipPlayer.draw(v); start(); } if (!v.ended && !over) v.requestVideoFrameCallback(onFrame); };
  v.addEventListener('ended', end, { once: true });
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame);
  (function tick() { if (performance.now() - lastVF > 40 && fresh()) { clipPlayer.draw(v); start(); } if (!v.ended && !over) requestAnimationFrame(tick); })();
  v.playbackRate = (v.duration || 2.5) / KT.clip;
  const pr = v.play(); if (pr) pr.catch(end);
  setTimeout(end, KT.clip * 1000 + 300); }); }   // never let a stalled clip hold up the story
const clipsOk = () => clipPlayer.ok && CLIP.rise.readyState >= 2 && CLIP.lower.readyState >= 2;
// the layers add up (see .rig), so these fades are true cross-fades between pictures of the same pose
const fade = (out, inn, ms) => tween(ms, e => { out.style.opacity = 1 - e; inn.style.opacity = e; }, E.sine);
async function toTop() {        // side view (your knight) → camera rises → top view picture
  if (!clipsOk()) { await fade(still, topStill, 600); view = 'top'; return; }
  await seek(CLIP.rise, 0);
  // the clip's first frames are the same pose as your knight, so the switch from the still to the clip can't be seen
  await play(CLIP.rise, () => { panCv.style.opacity = 1; still.style.opacity = 0; });
  await fade(panCv, topStill, KT.fadeOut); view = 'top';
}
async function toSide() {       // top view → camera comes back down → your knight
  if (!clipsOk()) { await fade(topStill, still, 600); view = 'side'; return; }
  await seek(CLIP.lower, 0);
  view = 'side';
  await play(CLIP.lower, () => { panCv.style.opacity = 1; topStill.style.opacity = 0; });
  await fade(panCv, still, KT.fadeIn);
}
const diamonds = $('diamonds'), iterateBtn = $('iterate');
let knightBusy = true;
function ready(on) { knightBusy = !on; on ? iterateBtn.removeAttribute('aria-disabled') : iterateBtn.setAttribute('aria-disabled', 'true'); }
function untilTurn(p) { return new Promise(r => { const chk = () => turnP >= p ? r() : requestAnimationFrame(chk); chk(); }); }
async function entrance() {     // the twist-and-land at the start spot, as on the home page
  view = 'side';
  kWrap.style.transform = ''; kWrap.style.filter = ''; turnP = 0;
  topStill.style.opacity = 0; panCv.style.opacity = 0;
  await playTurn();
}
async function tour() {         // from the start spot (side view, resting): rise, walk, hop out, come down
  await wait(KT.pause); await toTop();
  await wait(KT.pause); const last = await walk();
  await wait(KT.pause);
  await hopThrough(lMove(last, EXIT));                                    // out of the diamonds, still seen from above
  light(null);
  await wait(KT.pause); await toSide();
  ready(true);
}
async function firstRun() {
  ready(false);
  const turn = entrance();
  untilTurn(0.55).then(() => reveal(diamonds, 1400, 14, 0));      // the diamond process appears as the knight comes in to land
  await turn;
  await tour();
}
// make sure the knight's whole entrance is in view: one gentle glide, never blocking your own scrolling
function frameKnight() {
  const k = innerWidth / 1440, top = (1540 - 257.3) * k, bottom = (2100 - 257.3) * k;
  const target = Math.max(0, Math.min((top + bottom) / 2 - innerHeight / 2, top - 12));
  if (Math.abs(target - scrollY) > 24) scrollTo({ top: target, behavior: 'smooth' });
}
let journeyStarted = false;
async function journey() {
  if (journeyStarted) return; journeyStarted = true;
  await loaded;
  frameKnight();
  firstRun();
}
iterateBtn.addEventListener('click', async () => {
  if (knightBusy) return;
  ready(false);
  styleNow = (styleNow + 1) % STYLES.length;
  // the knight lifts away where it stands; the diamonds stay. Then it twists in at the start, just like the first time.
  await tween(300, e => { place(EXIT, e * 0.6); rig.style.opacity = 1 - e; }, E.sine);
  await wait(80);
  await entrance();
  await tour();
});

// ---- theme switch (shared with the home page)
const themeBtn = $('themeBtn');
function currentTheme() { return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; }
function labelTheme() { themeBtn.setAttribute('aria-label', currentTheme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'); }
labelTheme();
themeBtn.addEventListener('click', () => {
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  const apply = () => { document.documentElement.dataset.theme = next; labelTheme(); };
  try { localStorage.setItem('theme', next); } catch (e) {}
  if (document.startViewTransition && !reduced) document.startViewTransition(apply); else apply();
});

// ---- order of things
// download a whole clip and play it from memory: streamed instead, Safari runs dry mid-turn (the clips play at ~2× speed) and the knight stalls
function inMemory(v) {
  const ready = () => new Promise(r => v.readyState >= 4 ? r() : v.addEventListener('canplaythrough', r, { once: true }));
  const src = v.getAttribute('src');
  if (!src || !/\.mp4$/.test(src)) { v.preload = 'auto'; v.load(); return ready(); }   // already packed into the page (opened from a folder)
  return fetch(src, { priority: 'low' }).then(r => r.ok ? r.blob() : Promise.reject())
    .then(b => { v.src = URL.createObjectURL(b); }, () => { v.preload = 'auto'; })
    .then(() => { v.load(); return ready(); });
}
const loaded = Promise.all([
  window.FONTS,
  Promise.race([inMemory(video), wait(10000)]),
  ...Object.values(CLIP).map(v => Promise.race([inMemory(v), wait(10000)])),
  // only the pictures that load straight away (lazy ones, like the footer knight, load when scrolled to; Safari would wait for them)
  ...[...document.images].filter(i => i.loading !== 'lazy').map(i => Promise.race([i.decode().catch(() => {}), wait(4000)])),
]);
const fontsIn = window.FONTS.then(() => { sizeCards(); });

async function intro() {        // nothing fades in any more: the page is simply there, and the hand waves from the first paint
  await loaded; await fontsIn;
}

function watch(el, fn, threshold = 0.3) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.disconnect(); fn(); } }), { threshold });
  io.observe(el);
}

if (reduced) {
  document.querySelectorAll('.pre').forEach(el => el.style.opacity = 1);
  Object.values(phases).forEach(p => p.classList.add('on'));
  fontsIn.then(() => cards.slice(0, 2).forEach(c => { c.classList.add('show'); c.setAttribute('aria-hidden', 'false'); }));
  document.querySelectorAll('.rc').forEach(c => c.style.transition = 'none');
  loaded.then(async () => { noVideo = true; pose(1); cv.style.visibility = 'hidden'; });
} else {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
  const introDone = intro();
  // sections fade up softly as they come into view
  document.querySelectorAll('.rv').forEach(el => watch(el, async () => { await introDone; reveal(el, 1800, 16, 8); }, 0.4));
  // the first pair is there from the start (below the fold); the carousel begins turning 4 seconds after the page has loaded
  loaded.then(() => fontsIn).then(() => { showPair(0, 1, 0); setTimeout(() => { autoOn = true; goTo(1, 1); }, 4000); });
  watch($('diaZone'), async () => { await introDone; journey(); }, 0.35);
}
window.__journey = journey;
</script>
<script src="mailcopy.js"></script>
<script>
// glass rim: its thin ring is cut with a clip path as well as the mask, so it stays a ring where Safari fails to draw the mask
const glassRing = el => { const w = el.offsetWidth, h = el.offsetHeight; if (!w || !h) return; const b = getComputedStyle(el).borderTopLeftRadius, n = parseFloat(b) || 0;
  const r = Math.min(/%/.test(b) ? Math.min(w, h) * n / 100 : n, w / 2, h / 2), box = (o, q) => { const W = w - 2 * o, H = h - 2 * o; q = Math.max(q, 0);
    return `M${o + q} ${o}h${W - 2 * q}a${q} ${q} 0 0 1 ${q} ${q}v${H - 2 * q}a${q} ${q} 0 0 1 ${-q} ${q}h${2 * q - W}a${q} ${q} 0 0 1 ${-q} ${-q}v${2 * q - H}a${q} ${q} 0 0 1 ${q} ${-q}z`; };
  el.style.setProperty('--ring', `path(evenodd, '${box(0, r)}${box(1, r - 1)}')`); };
const glassRO = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => glassRing(e.target))) : null;
document.querySelectorAll('.glass').forEach(el => { glassRing(el); if (glassRO) glassRO.observe(el); });
</script>
